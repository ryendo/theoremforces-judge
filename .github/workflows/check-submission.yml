name: Legacy submission judge (disabled)

# Historical v1 submissions used `lake build` inside the same process that
# elaborated hostile Lean. That result cannot authorize v0.3 L1 acceptance.
# Keep the branch trigger only so any stale producer receives an explicit,
# auditable failure instead of a misleading success or a silent no-op.
on:
  push:
    branches:
      - "submission/**"
      - "challenge-validation/**"
  pull_request:
    paths:
      - "Theoremforces/Challenges/**/Submissions/Submission_*.lean"
      - "Theoremforces/Challenges/**/Validations/Validation_*.lean"

permissions:
  contents: read

concurrency:
  group: legacy-judge-disabled-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reject:
    name: Reject retired v1 judge path
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Fail closed
        shell: bash
        run: |
          echo "::error::The legacy GitHub Actions judge is permanently retired."
          echo "New judging remains paused until the v0.3 Gate C independent-checker pipeline is released."
          exit 1
