name: Whitepaper artifact integrity

on:
  push:
    branches: ["main"]
    paths:
      - "docs/whitepaper/**"
      - "output/pdf/*whitepaper-ver-0.3.pdf"
      - ".github/workflows/whitepapers.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "docs/whitepaper/**"
      - "output/pdf/*whitepaper-ver-0.3.pdf"
      - ".github/workflows/whitepapers.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install LaTeX and structural PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            fonts-texgyre \
            latexmk \
            poppler-utils \
            texlive-fonts-recommended \
            texlive-lang-japanese \
            texlive-latex-extra \
            texlive-luatex \

      - name: Rebuild audited artifacts from source
        shell: bash
        run: |
          set -euo pipefail
          snapshot=$(mktemp -d)
          cp output/pdf/theoremforces-whitepaper-ver-0.3.pdf "$snapshot/general.pdf"
          cp output/pdf/theoremforces-l1-whitepaper-ver-0.3.pdf "$snapshot/l1.pdf"
          make -C docs/whitepaper
          make -C docs/whitepaper/l1

          for pair in \
            "$snapshot/general.pdf:output/pdf/theoremforces-whitepaper-ver-0.3.pdf" \
            "$snapshot/l1.pdf:output/pdf/theoremforces-l1-whitepaper-ver-0.3.pdf"
          do
            committed=${pair%%:*}
            rebuilt=${pair#*:}
            test "$(pdfinfo "$committed" | awk '/^Pages:/ { print $2 }')" = \
                 "$(pdfinfo "$rebuilt" | awk '/^Pages:/ { print $2 }')"
            # TeX Live versions may wrap identical text differently. Compare
            # the complete extracted content after removing layout-only ASCII
            # whitespace, while the page-count check above catches pagination
            # drift.
            key=$(basename "$committed" .pdf)
            pdftotext "$committed" - | LC_ALL=C tr -d '[:space:]' > "$snapshot/$key-committed.txt"
            pdftotext "$rebuilt" - | LC_ALL=C tr -d '[:space:]' > "$snapshot/$key-rebuilt.txt"
            cmp "$snapshot/$key-committed.txt" "$snapshot/$key-rebuilt.txt"
          done

      - name: Validate both audited v0.3 artifacts
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            output/pdf/theoremforces-whitepaper-ver-0.3.pdf
            output/pdf/theoremforces-l1-whitepaper-ver-0.3.pdf
          )
          for pdf in "${expected[@]}"; do
            test -s "$pdf"
            pages=$(pdfinfo "$pdf" | awk '/^Pages:/ { print $2 }')
            test "${pages:-0}" -ge 2
            extracted=$(mktemp)
            pdftotext "$pdf" "$extracted"
            test -s "$extracted"
            grep -q "Version 0.3.0" "$extracted"
            if pdffonts "$pdf" | awk 'NR > 2 && $(NF-4) != "yes" { bad=1 } END { exit bad ? 0 : 1 }'; then
              echo "Unembedded font detected in $pdf" >&2
              exit 1
            fi
            rm -f "$extracted"
          done
